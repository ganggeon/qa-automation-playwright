name: Publish reviewed QA report

# Manual only: publish the reviewed static snapshot, without running tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Check reviewed snapshot
        run: test -s docs/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy reviewed snapshot
        id: deployment
        uses: actions/deploy-pages@v4
