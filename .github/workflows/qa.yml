name: QA Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 야간 정기 실행. 외부 데모 사이트가 바뀌었는지 매일 확인하는 목적도 겸한다.
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = KST 03:00
  workflow_dispatch:

jobs:
  # ── 1. 자체 SUT 대상 테스트 (반드시 통과해야 함) ──────────────────────────
  local:
    name: MiniShop (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 결과 요약 분류 검증
        run: node --test utils/playwright-summary.test.js

      - name: Slack 알림 판정 검증
        run: node --test utils/slack-notify.test.js

      - name: 타입 검사
        run: npm run typecheck

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 테스트 실행 (API + UI)
        run: npx playwright test --project=api --project=ui

      - name: Playwright 실행 요약
        if: ${{ !cancelled() }}
        run: node utils/playwright-summary.js

      # 이 job은 api + ui 만 실행한다. 따라서 여기서 생성되는 결과 문서는
      # **부분 실행 결과**다. report-to-csv.js 가 문서 머리에 범위를 명시하고,
      # 아티팩트 이름도 전체 결과와 구분되게 붙인다.
      # (저장소에 커밋된 artifacts/04-* 는 전체 스위트 실행 결과다)
      - name: 결과 리포트 변환 (api + ui 범위)
        if: ${{ !cancelled() }}
        run: node utils/report-to-csv.js

      - name: 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-report-api-ui
          path: |
            playwright-report/
            artifacts/04-테스트수행결과.csv
            artifacts/04-테스트수행결과-요약.md
          retention-days: 30

  # ── 2. 크로스 브라우저 (main 푸시 / 수동 실행 시에만) ─────────────────────
  cross-browser:
    name: 크로스 브라우저 (Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=ui-firefox --project=ui-webkit

      - name: Playwright 실행 요약
        if: ${{ !cancelled() }}
        run: node utils/playwright-summary.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cross-browser-report
          path: playwright-report/
          retention-days: 14

  # ── 3. 외부 공개 사이트 (실패해도 파이프라인을 막지 않음) ─────────────────
  #     남의 서버가 죽었다고 우리 빌드가 빨개지면 안 된다.
  #     대신 결과는 남겨서 "언제부터 깨졌는지" 추적할 수 있게 한다.
  external:
    name: 외부 데모 사이트 (참고용)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # continue-on-error 때문에 needs.external.result 는 실패해도 success 로 보인다.
    # 알림에는 테스트 단계의 실제 결과(outcome)를 따로 넘긴다.
    outputs:
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: tests
        run: npx playwright test --project=external-api --project=external-ui

      - name: Playwright 실행 요약
        if: ${{ !cancelled() }}
        run: node utils/playwright-summary.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: external-report
          path: playwright-report/
          retention-days: 14

  # ── 4. Postman / Newman ───────────────────────────────────────────────────
  #     이 컬렉션은 미수정 결함(BUG-001/006/008)을 그대로 재현하므로
  #     정확히 일치하는 알려진 실패만 별도 보고한다. 변경된 결과는 검토가 필요하다.
  newman:
    name: Postman 컬렉션 (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Unexpected failures must fail this job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 판정 로직 검증
        run: node --test utils/newman-verdict.test.js
      - name: 컬렉션 실행
        run: npm run newman:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 14

  # ── 5. 로그인 재구현판 (전용 설정: 4011 포트, /api/_reset 미사용) ──────────
  rebuilt:
    name: 로그인 재구현판 (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.rebuilt.config.ts

      - name: Playwright 실행 요약
        if: ${{ !cancelled() }}
        run: node utils/playwright-summary.js reports/rebuilt-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rebuilt-report
          path: playwright-report-rebuilt/
          retention-days: 14

  # ── 6. Slack 알림 (master 실행만) ─────────────────────────────────────────
  #     앞 Job이 실패해도 알림은 가야 하므로 always()로 실행한다.
  #     필수 Job이 모두 정확히 success일 때만 "통과"로 보낸다(utils/slack-notify.js).
  #     워크플로 전체가 강제 취소된 경우까지는 보장하지 않는다.
  notify:
    name: Slack 알림
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [local, rebuilt, cross-browser, external, newman]
    if: ${{ always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 결과 알림 보내기
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node utils/slack-notify.js
